<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vimficiency Benchmarks</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      font-size: 17px;
      line-height: 1.5;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
    h1 { font-size: 2rem; font-weight: 800; margin-bottom: 4px; }
    h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; }
    .subtitle { color: #666; font-size: 1.1rem; margin-bottom: 40px; }
    .optimizer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .optimizer-card {
      display: block;
      padding: 24px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .optimizer-card:hover {
      border-color: #4285f4;
      box-shadow: 0 2px 8px rgba(66, 133, 244, 0.15);
    }
    .optimizer-card h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
    .optimizer-card p { color: #666; font-size: 0.95rem; }
    #top-changes { display: none; margin-top: 40px; }
    .change-list { display: flex; flex-direction: column; gap: 8px; }
    .change-item {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 10px 14px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .change-item a {
      color: inherit;
      text-decoration: none;
      font-weight: 600;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .change-item a:hover { text-decoration: underline; }
    .change-pct { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .change-pct.regression { color: #d93025; }
    .change-pct.improvement { color: #1e8e3e; }
    .change-times { color: #888; font-size: 0.85rem; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Vimficiency Benchmarks</h1>
    <p class="subtitle">Performance tracking across commits</p>
    <div class="optimizer-grid">
      <a class="optimizer-card" href="bench/edit/">
        <h3>EditOptimizer</h3>
        <p>Edit operation optimization</p>
      </a>
      <a class="optimizer-card" href="bench/motion/">
        <h3>MotionOptimizer</h3>
        <p>Cursor motion optimization</p>
      </a>
      <a class="optimizer-card" href="bench/composition/">
        <h3>CompositionOptimizer</h3>
        <p>Full composition optimization</p>
      </a>
    </div>
    <div id="top-changes">
      <h2>Biggest recent changes</h2>
      <div class="change-list" id="change-list"></div>
    </div>
  </div>
  <script type="module" src="./src/pages/home.ts"></script>
</body>
</html>
