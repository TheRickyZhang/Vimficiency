# Shared by every animation under anim/. Render from this directory so the
# paths below resolve: `.venv/bin/manim render -qh <anim>/scene.py <Scene>`.
[CLI]
# Regenerable cache: partial movies, text/Tex SVGs, images, logs.
media_dir = .cache
partial_movie_dir = {media_dir}/partial_movie_files/{scene_name}
sections_dir = {media_dir}/sections/{scene_name}
# Final videos, one dir per quality so a -ql preview never overwrites the -qh render.
video_dir = out/{quality}
# The walkthrough has well over 100 play() calls; keep every segment cached so
# re-renders only encode what changed.
max_files_cached = 400
