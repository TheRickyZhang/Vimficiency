<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" height="170" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">
  <defs>
    <marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--vf-kept)"/></marker>
  </defs>
  <text x="20" y="28" font-weight="600">initial buffer</text>
  <!-- bar -->
  <rect x="20" y="60" width="600" height="30" rx="4" fill="var(--vf-kept)" fill-opacity="0.3"/>
  <!-- block 1: edit · short run · edit -->
  <rect x="20" y="60" width="150" height="30" rx="4" fill="var(--vf-delete)" fill-opacity="0.7"/>
  <rect x="80" y="60" width="22" height="30" fill="var(--vf-kept)" fill-opacity="0.9"/>
  <!-- margins -->
  <rect x="170" y="60" width="18" height="30" fill="var(--vf-delete)" fill-opacity="0.3"/>
  <rect x="452" y="60" width="18" height="30" fill="var(--vf-delete)" fill-opacity="0.3"/>
  <!-- block 2 -->
  <rect x="470" y="60" width="150" height="30" rx="4" fill="var(--vf-delete)" fill-opacity="0.7"/>
  <!-- labels -->
  <text x="95" y="112" text-anchor="middle">block 1</text>
  <text x="95" y="128" text-anchor="middle" font-size="11" opacity="0.8">edit · short kept run · edit</text>
  <text x="320" y="112" text-anchor="middle">sealed core</text>
  <text x="320" y="128" text-anchor="middle" font-size="11" opacity="0.8">type(core) &gt; move(core) + round trip + slack</text>
  <text x="545" y="112" text-anchor="middle">block 2</text>
  <text x="179" y="152" text-anchor="middle" font-size="11" opacity="0.8">margin</text>
  <text x="461" y="152" text-anchor="middle" font-size="11" opacity="0.8">margin</text>
  <!-- cross arc -->
  <path d="M188 56 C 260 20, 380 20, 452 56" fill="none" stroke="var(--vf-kept)" stroke-width="2.5" marker-end="url(#arrs)"/>
  <text x="320" y="40" text-anchor="middle" font-weight="600" fill="var(--vf-kept)">one CROSS move</text>
</svg>
