name: Remove benchmark data

on:
  workflow_dispatch:
    inputs:
      sha:
        description: '7+ char commit SHA to remove from benchmark data'
        required: true
        type: string

jobs:
  remove:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/bench-data.js

      - name: Save script
        run: cp scripts/bench-data.js /tmp/bench-data.js

      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove benchmark data for ${{ inputs.sha }}
        run: |
          SHA="${{ inputs.sha }}"
          for dir in bench/edit bench/motion bench/composition; do
            [ -f "$dir/data.js" ] && node /tmp/bench-data.js remove "$dir" "$SHA"
          done

      - name: Commit and push
        run: |
          git add bench/edit/data.js bench/motion/data.js bench/composition/data.js
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "Remove benchmark data for ${{ inputs.sha }}" || { echo "Nothing to remove for ${{ inputs.sha }}"; exit 1; }
          git push origin gh-pages
