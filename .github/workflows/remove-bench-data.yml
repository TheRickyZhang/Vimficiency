name: Remove benchmark data

on:
  workflow_dispatch:
    inputs:
      sha:
        description: '7+ char commit SHA to remove from benchmark data'
        required: true
        type: string

jobs:
  remove:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/bench-data.ts

      - name: Save script
        run: cp scripts/bench-data.ts /tmp/bench-data.ts

      - uses: oven-sh/setup-bun@v2

      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove benchmark data for ${{ inputs.sha }}
        run: |
          SHA="${{ inputs.sha }}"
          for dir in edit motion composition; do
            [ -f "$dir/data.json" ] && bun /tmp/bench-data.ts remove "$dir" "$SHA"
          done

      - name: Commit and push
        run: |
          git add -f edit/data.json motion/data.json composition/data.json
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "Remove benchmark data for ${{ inputs.sha }}" || { echo "Nothing to remove for ${{ inputs.sha }}"; exit 1; }
          git push origin gh-pages
