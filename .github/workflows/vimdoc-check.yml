name: vimdoc-check

# Validates both consumers of `doc-src/*.md` on PR: panvimdoc generation
# and the Astro Starlight build. A change to either source surface or
# either pipeline triggers a build. The docs job also builds the planner
# wasm module the "How it works" widgets load, so any `src/` change runs it too:
# the module compiles sources from several modules, not just the planner.
on:
  pull_request:
    paths:
      - 'doc-src/**'
      - 'web/docs/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.emscripten-version'
      - 'scripts/build-docs-site.sh'
      - 'scripts/smoke-planner-wasm.ts'
      - 'scripts/build-vimdoc-source.sh'
      - 'scripts/postprocess-vimdoc.sh'
      - '.github/actions/setup-emscripten/**'
      - '.github/workflows/vimdoc.yml'
      - '.github/workflows/vimdoc-check.yml'

permissions:
  contents: read

jobs:
  vimdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build vimdoc source markdown
        run: bash scripts/build-vimdoc-source.sh

      - name: Convert to vimdoc via panvimdoc
        uses: kdheepak/panvimdoc@v4.0.1
        with:
          vimdoc: vimficiency
          pandoc: build/vimficiency.md
          version: 'Neovim >= 0.11'
          treesitter: 'true'
          ignore-rawblocks: 'true'
          dedup-subheadings: 'true'

      - name: Post-process vimdoc
        run: bash scripts/postprocess-vimdoc.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/setup-emscripten
      - name: Build and verify docs site
        run: scripts/build-docs-site.sh
