name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-test-${{ runner.os }}

      - name: Install deps
        run: pacman -Syu --noconfirm base-devel cmake git neovim

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DVIMFICIENCY_DEBUG=OFF
          cmake --build build -j$(nproc)

      - name: Unit tests
        run: ./build/tests/vimficiency_tests --gtest_brief=1

  benchmark-run:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-bench-${{ runner.os }}

      - name: Install deps
        run: pacman -Syu --noconfirm base-devel cmake git

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DVIMFICIENCY_DEBUG=OFF
          cmake --build build -j$(nproc)

      - name: Run EditOptimizer benchmarks
        run: |
          VIMFICIENCY_SEED_MODE=fixed \
          ./build/tests/vimficiency_benchmarks \
            --benchmark_filter="EditOptimizer.*" \
            --benchmark_format=json \
            --benchmark_out=edit_result.json
      - name: Run MotionOptimizer benchmarks
        run: |
          VIMFICIENCY_SEED_MODE=fixed \
          ./build/tests/vimficiency_benchmarks \
            --benchmark_filter="MotionOptimizer.*" \
            --benchmark_format=json \
            --benchmark_out=motion_result.json
      - name: Run CompositionOptimizer benchmarks
        run: |
          VIMFICIENCY_SEED_MODE=fixed \
          ./build/tests/vimficiency_benchmarks \
            --benchmark_filter="CompositionOptimizer.*" \
            --benchmark_format=json \
            --benchmark_out=composition_result.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            edit_result.json
            motion_result.json
            composition_result.json

  benchmark-store:
    runs-on: ubuntu-latest
    needs: benchmark-run
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results

      - name: Store EditOptimizer results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'googlecpp'
          output-file-path: edit_result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: bench/edit
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
      - name: Store MotionOptimizer results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'googlecpp'
          output-file-path: motion_result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: bench/motion
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
      - name: Store CompositionOptimizer results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'googlecpp'
          output-file-path: composition_result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: bench/composition
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false

      - uses: oven-sh/setup-bun@v2

      - name: Build dashboard
        working-directory: bench-dashboard
        run: bun install --frozen-lockfile && bun run build

      - name: Deploy dashboard
        run: |
          cp -r bench-dashboard/dist /tmp/dashboard-dist

          git fetch origin gh-pages
          git checkout gh-pages

          # Prune benchmark entries for commits no longer on main
          git log origin/main --format=%H > /tmp/valid-commits.txt
          for dir in bench/edit bench/motion bench/composition; do
            [ -f "$dir/data.js" ] || continue
            node -e "
              const fs = require('fs');
              const valid = new Set(fs.readFileSync('/tmp/valid-commits.txt', 'utf8').trim().split('\n'));
              const src = fs.readFileSync('$dir/data.js', 'utf8');
              const json = src.replace(/^window\.BENCHMARK_DATA\s*=\s*/, '').replace(/;\s*$/, '');
              const data = JSON.parse(json);
              for (const [key, runs] of Object.entries(data.entries)) {
                data.entries[key] = runs.filter(r => valid.has(r.commit.id));
              }
              fs.writeFileSync('$dir/data.js', 'window.BENCHMARK_DATA = ' + JSON.stringify(data, null, 2) + ';\n');
            "
          done

          # Root index
          cp /tmp/dashboard-dist/index.html ./index.html
          touch .nojekyll

          # Shared assets
          mkdir -p bench/assets
          cp -r /tmp/dashboard-dist/assets/* bench/assets/ 2>/dev/null || true

          # Optimizer pages (preserves existing data.js)
          for dir in bench/edit bench/motion bench/composition; do
            [ -d "$dir" ] && cp /tmp/dashboard-dist/optimizer.html "$dir/index.html"
          done

          git add index.html .nojekyll bench/
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "Update benchmark dashboard" || true
          git push origin gh-pages
