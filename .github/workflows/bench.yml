name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ~/.cache/ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 ccache
          curl -LO https://github.com/neovim/neovim/releases/download/v0.11.5/nvim-linux-x86_64.tar.gz
          sudo tar xzf nvim-linux-x86_64.tar.gz -C /usr/local --strip-components=1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-test-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-test-${{ github.ref }}-
            ccache-test-

      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-v2-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DVIMFICIENCY_DEBUG=OFF \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)

      - name: Unit tests
        run: ./build/tests/vimficiency_tests --gtest_brief=1

  benchmark-run:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    env:
      CCACHE_DIR: ~/.cache/ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-bench-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-bench-${{ github.ref }}-
            ccache-bench-

      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-v2-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DVIMFICIENCY_DEBUG=OFF \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)

      - name: Run EditOptimizer benchmarks
        run: |
          VIMFICIENCY_SEED_MODE=fixed \
          ./build/tests/vimficiency_benchmarks \
            --benchmark_filter="EditOptimizer.*" \
            --benchmark_format=json \
            --benchmark_out=edit_result.json
      - name: Run MotionOptimizer benchmarks
        run: |
          VIMFICIENCY_SEED_MODE=fixed \
          ./build/tests/vimficiency_benchmarks \
            --benchmark_filter="MotionOptimizer.*" \
            --benchmark_format=json \
            --benchmark_out=motion_result.json
      - name: Run CompositionOptimizer benchmarks
        run: |
          VIMFICIENCY_SEED_MODE=fixed \
          ./build/tests/vimficiency_benchmarks \
            --benchmark_filter="CompositionOptimizer.*" \
            --benchmark_format=json \
            --benchmark_out=composition_result.json

      - name: Build and run baseline benchmarks
        run: |
          CURRENT=$(git rev-parse HEAD)
          git checkout HEAD~1

          cmake --build build -j$(nproc)

          VIMFICIENCY_SEED_MODE=fixed \
          ./build/tests/vimficiency_benchmarks \
            --benchmark_filter="EditOptimizer.*" \
            --benchmark_format=json \
            --benchmark_out=baseline_edit.json
          VIMFICIENCY_SEED_MODE=fixed \
          ./build/tests/vimficiency_benchmarks \
            --benchmark_filter="MotionOptimizer.*" \
            --benchmark_format=json \
            --benchmark_out=baseline_motion.json
          VIMFICIENCY_SEED_MODE=fixed \
          ./build/tests/vimficiency_benchmarks \
            --benchmark_filter="CompositionOptimizer.*" \
            --benchmark_format=json \
            --benchmark_out=baseline_composition.json

          git checkout $CURRENT

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            edit_result.json
            motion_result.json
            composition_result.json
            baseline_edit.json
            baseline_motion.json
            baseline_composition.json

  benchmark-store:
    runs-on: ubuntu-latest
    needs: benchmark-run
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results

      - uses: oven-sh/setup-bun@v2

      - name: Compare against baseline
        continue-on-error: true
        run: |
          bun scripts/bench-compare.ts \
            edit_result.json baseline_edit.json \
            motion_result.json baseline_motion.json \
            composition_result.json baseline_composition.json

      - name: Store EditOptimizer results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'googlecpp'
          output-file-path: edit_result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: bench/edit
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
      - name: Store MotionOptimizer results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'googlecpp'
          output-file-path: motion_result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: bench/motion
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
      - name: Store CompositionOptimizer results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'googlecpp'
          output-file-path: composition_result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: bench/composition
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false

      - name: Build dashboard
        working-directory: bench-dashboard
        run: bun install --frozen-lockfile && bun run build

      - name: Deploy dashboard
        run: |
          cp -r bench-dashboard/dist /tmp/dashboard-dist
          cp scripts/bench-data.js /tmp/bench-data.js

          git fetch origin gh-pages
          git checkout gh-pages

          # Keep only the last 100 benchmark entries per suite
          for dir in bench/edit bench/motion bench/composition; do
            [ -f "$dir/data.js" ] && node /tmp/bench-data.js prune "$dir"
          done

          # Root index
          cp /tmp/dashboard-dist/index.html ./index.html
          touch .nojekyll

          # Shared assets
          mkdir -p bench/assets
          cp -r /tmp/dashboard-dist/assets/* bench/assets/ 2>/dev/null || true

          # Optimizer pages (preserves existing data.js)
          for dir in bench/edit bench/motion bench/composition; do
            [ -d "$dir" ] && cp /tmp/dashboard-dist/optimizer.html "$dir/index.html"
          done

          git add index.html .nojekyll bench/
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "Update benchmark dashboard" || true
          git push origin gh-pages
