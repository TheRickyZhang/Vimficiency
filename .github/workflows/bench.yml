name: CI
on: [push, pull_request]

env:
  NEOVIM_VERSION: v0.11.5

jobs:
  dependency-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint module dependencies
        run: ./scripts/lint-module-deps.sh

  test:
    runs-on: ubuntu-latest
    needs: dependency-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup CI deps
        uses: ./.github/actions/setup-ci-deps
        with:
          install-neovim: "true"
          neovim-version: ${{ env.NEOVIM_VERSION }}

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: test

      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-v2-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: deps-v2-

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DVIMFICIENCY_DEBUG=OFF \
            -DVIMFICIENCY_ENABLE_DEBUG_TRACKING=OFF \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)

      - name: Unit tests
        run: ./build/tests/vimficiency_tests --gtest_brief=1 --gtest_output=json:test_timing.json

      - name: Build tracking-enabled exploration target
        run: |
          cmake -B build_track -DCMAKE_BUILD_TYPE=Release -DVIMFICIENCY_DEBUG=OFF \
            -DVIMFICIENCY_ENABLE_DEBUG_TRACKING=ON \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build_track --target vimficiency_explore -j$(nproc)

      - name: Upload test timing
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: test-timing
          path: test_timing.json

  benchmark-run:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup CI deps
        uses: ./.github/actions/setup-ci-deps

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: bench

      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-v2-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: deps-v2-

      - name: Build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DVIMFICIENCY_DEBUG=OFF \
            -DVIMFICIENCY_ENABLE_DEBUG_TRACKING=OFF \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)

      - name: Run EditOptimizer benchmarks
        run: |
          VIMFICIENCY_SEED_MODE=fixed \
          ./build/tests/vimficiency_benchmarks \
            --benchmark_filter="EditOpt.*" \
            --benchmark_format=json \
            --benchmark_out=edit_result.json
      - name: Run MotionOptimizer benchmarks
        run: |
          VIMFICIENCY_SEED_MODE=fixed \
          ./build/tests/vimficiency_benchmarks \
            --benchmark_filter="MotionOpt.*" \
            --benchmark_format=json \
            --benchmark_out=motion_result.json
      - name: Run CompositionOptimizer benchmarks
        run: |
          VIMFICIENCY_SEED_MODE=fixed \
          ./build/tests/vimficiency_benchmarks \
            --benchmark_filter="CompositionOpt.*" \
            --benchmark_format=json \
            --benchmark_out=composition_result.json

      - name: Collect exploration data
        if: github.ref == 'refs/heads/main'
        run: |
          cmake -B build_track -DCMAKE_BUILD_TYPE=Release -DVIMFICIENCY_DEBUG=OFF \
            -DVIMFICIENCY_ENABLE_DEBUG_TRACKING=ON \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build_track --target vimficiency_explore -j$(nproc)
          VIMFICIENCY_SEED_MODE=fixed ./build_track/tests/vimficiency_explore

      - name: Build and run baseline benchmarks
        run: |
          CURRENT=$(git rev-parse HEAD)
          git checkout HEAD~1

          cmake -B build -DCMAKE_BUILD_TYPE=Release -DVIMFICIENCY_DEBUG=OFF \
            -DVIMFICIENCY_ENABLE_DEBUG_TRACKING=OFF \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)

          VIMFICIENCY_SEED_MODE=fixed \
          ./build/tests/vimficiency_benchmarks \
            --benchmark_filter="EditOpt.*" \
            --benchmark_format=json \
            --benchmark_out=baseline_edit.json
          VIMFICIENCY_SEED_MODE=fixed \
          ./build/tests/vimficiency_benchmarks \
            --benchmark_filter="MotionOpt.*" \
            --benchmark_format=json \
            --benchmark_out=baseline_motion.json
          VIMFICIENCY_SEED_MODE=fixed \
          ./build/tests/vimficiency_benchmarks \
            --benchmark_filter="CompositionOpt.*" \
            --benchmark_format=json \
            --benchmark_out=baseline_composition.json

          git checkout $CURRENT

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            edit_result.json
            motion_result.json
            composition_result.json
            baseline_edit.json
            baseline_motion.json
            baseline_composition.json

      - name: Upload exploration results
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: exploration-results
          path: |
            edit_explore.json
            motion_explore.json
            composition_explore.json

  benchmark-store:
    runs-on: ubuntu-latest
    needs: benchmark-run
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute deploy metadata
        id: meta
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's|/|--|g; s|[^a-zA-Z0-9._-]||g')
          if [ "$BRANCH" = "main" ]; then
            echo "is-main=true" >> "$GITHUB_OUTPUT"
            echo "base-path=/Vimficiency/" >> "$GITHUB_OUTPUT"
            echo "deploy-dir=." >> "$GITHUB_OUTPUT"
          else
            echo "is-main=false" >> "$GITHUB_OUTPUT"
            echo "base-path=/Vimficiency/branch/$SAFE_BRANCH/" >> "$GITHUB_OUTPUT"
            echo "deploy-dir=branch/$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          fi
          echo "safe-branch=$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results

      - name: Download test timing
        if: steps.meta.outputs.is-main == 'true'
        uses: actions/download-artifact@v4
        with:
          name: test-timing

      - name: Download exploration results
        if: steps.meta.outputs.is-main == 'true'
        uses: actions/download-artifact@v4
        with:
          name: exploration-results

      - uses: oven-sh/setup-bun@v2

      - name: Compare against baseline
        continue-on-error: true
        run: |
          bun scripts/bench-compare.ts \
            edit_result.json baseline_edit.json \
            motion_result.json baseline_motion.json \
            composition_result.json baseline_composition.json

      - name: Build dashboard
        working-directory: bench-dashboard
        run: |
          bun install --frozen-lockfile
          bun run build -- --base=${{ steps.meta.outputs.base-path }}

      - name: Deploy to gh-pages (main)
        if: steps.meta.outputs.is-main == 'true'
        run: |
          # Convert test timing to benchmark format
          bun scripts/convert-gtest-timing.ts test_timing.json test_timing_bench.json

          # Save artifacts before switching branches
          cp -r bench-dashboard/dist /tmp/dashboard-dist
          cp scripts/bench-data.ts /tmp/bench-data.ts
          cp scripts/explore-data.ts /tmp/explore-data.ts
          cp test_timing_bench.json /tmp/test_timing_bench.json
          cp edit_result.json /tmp/edit_result.json
          cp motion_result.json /tmp/motion_result.json
          cp composition_result.json /tmp/composition_result.json
          cp edit_explore.json /tmp/edit_explore.json
          cp motion_explore.json /tmp/motion_explore.json
          cp composition_explore.json /tmp/composition_explore.json

          COMMIT_ID="${{ github.sha }}"
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          COMMIT_TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_AUTHOR="${{ github.actor }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          git fetch origin gh-pages
          git checkout gh-pages

          # One-time migration: move data from old bench/ layout to flat layout
          for optimizer in edit motion composition; do
            if [ -d "bench/$optimizer" ] && [ ! -d "$optimizer" ]; then
              echo "Migrating bench/$optimizer -> $optimizer"
              mv "bench/$optimizer" "$optimizer"
            fi
          done
          rm -rf bench

          # Ingest benchmark results into data.json (migrates from data.js on first run)
          for pair in "edit:/tmp/edit_result.json" "motion:/tmp/motion_result.json" "composition:/tmp/composition_result.json" "tests:/tmp/test_timing_bench.json"; do
            optimizer="${pair%%:*}"
            result="${pair#*:}"
            mkdir -p "$optimizer"
            bun /tmp/bench-data.ts ingest "$optimizer" "$result" \
              --commit-id="$COMMIT_ID" \
              --commit-msg="$COMMIT_MSG" \
              --commit-ts="$COMMIT_TS" \
              --author="$COMMIT_AUTHOR" \
              --repo-url="$REPO_URL"
          done

          # Remove stale suites (from benchmark renames) and prune to last 100 entries
          for dir in edit motion composition tests; do
            if [ -f "$dir/data.json" ]; then
              bun /tmp/bench-data.ts clean-suites "$dir"
              bun /tmp/bench-data.ts prune "$dir"
            fi
          done

          # Ingest exploration data into explore.json (strip states from older entries)
          for pair in "edit:/tmp/edit_explore.json" "motion:/tmp/motion_explore.json" "composition:/tmp/composition_explore.json"; do
            optimizer="${pair%%:*}"
            explore_json="${pair#*:}"
            mkdir -p "$optimizer"
            bun /tmp/explore-data.ts ingest "$optimizer" "$explore_json" \
              --commit-id="$COMMIT_ID" \
              --commit-msg="$COMMIT_MSG" \
              --commit-ts="$COMMIT_TS" \
              --author="$COMMIT_AUTHOR" \
              --repo-url="$REPO_URL"
          done

          # Prune exploration data to last 100 entries
          for dir in edit motion composition; do
            if [ -f "$dir/explore.json" ]; then
              bun /tmp/explore-data.ts prune "$dir"
            fi
          done

          # Root index (SPA: same index.html serves all routes)
          cp /tmp/dashboard-dist/index.html ./index.html
          cp /tmp/dashboard-dist/index.html ./404.html
          touch .nojekyll

          # Shared assets
          mkdir -p assets
          cp -r /tmp/dashboard-dist/assets/* assets/ 2>/dev/null || true

          git add -f index.html 404.html .nojekyll assets/ edit/ motion/ composition/ tests/
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "Update benchmark dashboard" || true
          git push origin gh-pages

      - name: Deploy to gh-pages (branch)
        if: steps.meta.outputs.is-main == 'false'
        env:
          DEPLOY_DIR: ${{ steps.meta.outputs.deploy-dir }}
        run: |
          # Save artifacts before switching branches
          cp -r bench-dashboard/dist /tmp/dashboard-dist
          cp scripts/bench-data.ts /tmp/bench-data.ts
          cp edit_result.json /tmp/edit_result.json
          cp motion_result.json /tmp/motion_result.json
          cp composition_result.json /tmp/composition_result.json

          COMMIT_ID="${{ github.sha }}"
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          COMMIT_TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_AUTHOR="${{ github.actor }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          git fetch origin gh-pages
          git checkout gh-pages

          # Seed branch data from main's data.json if not already present
          for optimizer in edit motion composition; do
            mkdir -p "$DEPLOY_DIR/$optimizer"
            if [ ! -f "$DEPLOY_DIR/$optimizer/data.json" ] && [ -f "$optimizer/data.json" ]; then
              cp "$optimizer/data.json" "$DEPLOY_DIR/$optimizer/data.json"
            fi
          done

          # Ingest branch commit's benchmark results (edit, motion, composition only)
          for pair in "edit:/tmp/edit_result.json" "motion:/tmp/motion_result.json" "composition:/tmp/composition_result.json"; do
            optimizer="${pair%%:*}"
            result="${pair#*:}"
            bun /tmp/bench-data.ts ingest "$DEPLOY_DIR/$optimizer" "$result" \
              --commit-id="$COMMIT_ID" \
              --commit-msg="$COMMIT_MSG" \
              --commit-ts="$COMMIT_TS" \
              --author="$COMMIT_AUTHOR" \
              --repo-url="$REPO_URL"
          done

          # Copy dashboard assets to branch directory
          cp /tmp/dashboard-dist/index.html "$DEPLOY_DIR/index.html"
          mkdir -p "$DEPLOY_DIR/assets"
          cp -r /tmp/dashboard-dist/assets/* "$DEPLOY_DIR/assets/" 2>/dev/null || true

          git add -f "$DEPLOY_DIR/"
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "Update branch dashboard: ${{ steps.meta.outputs.branch }}" || true
          git push origin gh-pages

      - name: Comment on PR
        if: steps.meta.outputs.is-main == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.meta.outputs.branch }}"
          DASHBOARD_URL="https://${{ github.repository_owner }}.github.io${{ steps.meta.outputs.base-path }}"
          MARKER="<!-- bench-dashboard-link -->"

          # Find open PR for this branch
          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for branch $BRANCH, skipping comment"
            exit 0
          fi

          BODY="${MARKER}
          **Benchmark Dashboard:** ${DASHBOARD_URL}

          _Updated at $(date -u +"%Y-%m-%d %H:%M:%S UTC") for commit ${{ github.sha }}_"

          # Check for existing comment with marker
          EXISTING_COMMENT=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)

          if [ -n "$EXISTING_COMMENT" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT}" \
              -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi
