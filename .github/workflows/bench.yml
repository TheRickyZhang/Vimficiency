name: CI
on:
  pull_request:
  push:
    branches:
      - main

env:
  NEOVIM_VERSION: v0.11.5

jobs:
  dependency-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint module dependencies
        run: ./scripts/lint-module-deps.sh

  doc-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify doc-src frontmatter titles match H1 headings
        # `doc-src/*.md` feeds two consumers: Astro Starlight (reads
        # `title:` from frontmatter) and panvimdoc (reads the H1). Drift
        # between them silently produces different titles on the two
        # surfaces. Catches it on PR.
        run: bash scripts/check-doc-titles.sh

  # Debug build runs the C++ test binary with assertions active. The `test`
  # job below builds with `-DCMAKE_BUILD_TYPE=Release` (NDEBUG defined), so
  # `assert(x)` is a macro that discards `x` before compilation — any broken
  # expression inside an assertion body (missing method, typo, wrong type)
  # is invisible. A dedicated Debug build catches that class of bug on every
  # push. One matrix entry, ~2 min extra with ccache; cheap insurance.
  debug-build:
    runs-on: ubuntu-latest
    needs: dependency-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup CI deps
        uses: ./.github/actions/setup-ci-deps
        with:
          install-neovim: "true"
          neovim-version: ${{ env.NEOVIM_VERSION }}

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: debug-build

      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-v2-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: deps-v2-

      - name: Build (Debug)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DVIMF_ENABLE_FUZZTEST=OFF \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)

      - name: Unit tests (Debug)
        run: |
          ./build/tests/vimfy_unit_tests --gtest_brief=1
          ./build/tests/vimfy_expect_tests --gtest_brief=1

  test:
    runs-on: ubuntu-latest
    needs: dependency-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup CI deps
        uses: ./.github/actions/setup-ci-deps
        with:
          install-neovim: "true"
          neovim-version: ${{ env.NEOVIM_VERSION }}

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: test

      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-v2-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: deps-v2-

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DVIMF_DEBUG=OFF \
            -DVIMF_TRACK_STATES=OFF \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)

      - name: Fast correctness gate
        # Exercises deterministic C++ unit and expect tests, seeded property and
        # safety tests, and the Lua/FFI boundary through Neovim headless.
        run: scripts/vimfy_tests all "" seed

      - name: Build tracking-enabled exploration target
        run: |
          cmake -B build_track -DCMAKE_BUILD_TYPE=Release -DVIMF_DEBUG=OFF \
            -DVIMF_TRACK_STATES=ON \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build_track --target vimfy_explore -j$(nproc)
