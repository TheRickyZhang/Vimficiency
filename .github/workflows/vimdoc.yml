name: vimdoc

on:
  push:
    branches: [main]
    paths:
      - 'doc-src/**'
      - 'scripts/build-vimdoc-source.sh'
      - 'scripts/postprocess-vimdoc.sh'
      - '.github/workflows/vimdoc.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build vimdoc source markdown
        run: bash scripts/build-vimdoc-source.sh

      - name: Convert to vimdoc via panvimdoc
        uses: kdheepak/panvimdoc@v4.0.1
        with:
          vimdoc: vimficiency
          pandoc: build/vimficiency.md
          version: 'Neovim >= 0.11'
          treesitter: 'true'
          ignore-rawblocks: 'true'
          dedup-subheadings: 'true'

      - name: Post-process vimdoc
        run: bash scripts/postprocess-vimdoc.sh

      # A PR rather than a push to main: a bot commit landing on main right
      # after a push makes the next local push non-fast-forward.
      - name: Open PR with regenerated vimdoc
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/vimdoc
          commit-message: 'docs: regenerate vimdoc'
          title: 'docs: regenerate vimdoc'
          body: 'Regenerated `doc/vimficiency.txt` from `doc-src/`.'
          add-paths: doc/vimficiency.txt
          delete-branch: true
