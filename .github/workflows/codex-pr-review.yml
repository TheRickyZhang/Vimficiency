name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  codex_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate PR context
        id: prctx
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --prune origin "$BASE"
          git diff --stat=120 --summary "$BASE...$HEAD" > /tmp/pr.stat
          git diff --name-only "$BASE...$HEAD" > /tmp/pr.files
          echo "file_count=$(wc -l </tmp/pr.files | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "stat_bytes=$(wc -c </tmp/pr.stat | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Build Codex prompt
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          {
            cat .github/codex/prompts/review.md
            printf '\n'
            printf 'Review the changes between %s and %s.\n' "${BASE}" "${HEAD}"
            printf 'Use local git commands to inspect the diff and verify context:\n'
            printf '  - git diff --stat=120 --summary %s...%s\n' "${BASE}" "${HEAD}"
            printf '  - git diff --name-only %s...%s\n' "${BASE}" "${HEAD}"
            printf '  - git diff --unified=80 %s...%s -- <path>\n' "${BASE}" "${HEAD}"
            printf '  - git show %s:<path>\n' "${HEAD}"
            printf '\n'
            printf 'PR metadata:\n'
            printf '  - title: %s\n' "${PR_TITLE}"
            printf '  - body: %s\n' "${PR_BODY}"
            printf '  - changed files: %s\n' "${{ steps.prctx.outputs.file_count }}"
            printf '  - diff summary bytes: %s\n' "${{ steps.prctx.outputs.stat_bytes }}"
            printf '\n'
            printf 'Changed files:\n'
            cat /tmp/pr.files
            printf '\nDiff stat:\n'
            cat /tmp/pr.stat
          } > /tmp/codex_prompt.txt

      - name: Run Codex using the generated prompt
        id: codex_run
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # gpt-5.2-codex was shut down 2026-07-23; gpt-5.6-sol is OpenAI's
          # listed replacement.
          model: gpt-5.6-sol
          # The action defaults `text.verbosity` to "low"; the retired codex
          # model rejected anything but "medium", and "medium" is a valid value
          # for the replacement, so keep it via the Codex CLI's `-c` flag.
          codex-args: >-
            --output-schema .github/codex/schemas/pr_review.schema.json
            -c model_verbosity="medium"
          prompt-file: /tmp/codex_prompt.txt

      - name: Post review (inline comments) and refreshed summary
        uses: actions/github-script@v7
        with:
          script: |
            const raw = ${{ toJSON(steps.codex_run.outputs.final-message) }};
            const { execFileSync } = require("node:child_process");

            // Marker used to identify this bot's previous summary comments
            // so we can collapse them when posting a fresh one. Each new
            // summary lands at the bottom of the PR conversation; the prior
            // summaries are minimized as OUTDATED so the latest one is the
            // only visible "main" comment.
            const SUMMARY_MARKER = "<!-- vimfy-review-summary -->";

            function safeJsonParse(s) { try { return JSON.parse(s); } catch { return null; } }
            function isString(x) { return typeof x === "string"; }
            function isInt(x) { return Number.isInteger(x); }
            function normalizeDiffPath(path) {
              if (!isString(path) || path === "/dev/null") return null;
              return path.replace(/^[ab]\//, "");
            }

            function parseRightDiffLines(diff) {
              const validLinesByPath = new Map();
              if (!isString(diff)) return validLinesByPath;

              let path = null;
              let inHunk = false;
              let rightLine = 0;

              function linesForPath(p) {
                if (!validLinesByPath.has(p)) validLinesByPath.set(p, new Set());
                return validLinesByPath.get(p);
              }

              for (const row of diff.split("\n")) {
                if (row.startsWith("diff --git ")) {
                  path = null;
                  inHunk = false;
                  continue;
                }
                if (row.startsWith("+++ ")) {
                  path = normalizeDiffPath(row.slice(4));
                  inHunk = false;
                  if (path) linesForPath(path);
                  continue;
                }

                const hunk = row.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (hunk) {
                  inHunk = path !== null;
                  rightLine = Number(hunk[1]);
                  continue;
                }
                if (!inHunk || !path) continue;

                if (row.startsWith("+") || row.startsWith(" ")) {
                  linesForPath(path).add(rightLine);
                  rightLine++;
                  continue;
                }
                if (row.startsWith("-") || row.startsWith("\\")) continue;
              }
              return validLinesByPath;
            }

            function localDiff() {
              const base = context.payload.pull_request.base.sha;
              const head = context.payload.pull_request.head.sha;
              return execFileSync(
                "git",
                ["-c", "core.quotepath=false", "diff", "--no-ext-diff", "--unified=80", `${base}...${head}`],
                { encoding: "utf8", maxBuffer: 64 * 1024 * 1024 }
              );
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;
            const commit_id = context.payload.pull_request.head.sha;

            const parsed = safeJsonParse(raw);

            // Fallback: model returned non-JSON. Post the raw text as a
            // single summary comment so we don't silently drop the review.
            if (!parsed || !isString(parsed.body) || !Array.isArray(parsed.comments)) {
              await postSummary(typeof raw === "string" ? raw : String(raw));
              return;
            }

            const validLinesByPath = parseRightDiffLines(localDiff());

            const comments = [];
            const dropped = [];  // diagnostics for the run log only

            for (const c of parsed.comments) {
              if (!c || !isString(c.path) || !isInt(c.line) || c.line < 1) {
                dropped.push({ reason: "bad shape", c });
                continue;
              }
              if (c.side !== "RIGHT") {
                dropped.push({ reason: "non-RIGHT side", c });
                continue;
              }
              if (!isString(c.body) || !isString(c.severity)) {
                dropped.push({ reason: "missing body or severity", c });
                continue;
              }

              const validLines = validLinesByPath.get(c.path);
              if (!validLines) {
                dropped.push({ reason: `path not in PR diff (${c.path})`, c });
                continue;
              }
              if (!validLines.has(c.line)) {
                dropped.push({ reason: `line ${c.line} not in diff for ${c.path}`, c });
                continue;
              }

              const severity = c.severity.toLowerCase();
              comments.push({ path: c.path, line: c.line, side: "RIGHT", body: `[${severity}] ${c.body}` });
              if (comments.length >= 20) break;
            }

            // Surface dropped comments in the run log so we can diagnose
            // "no inline issues appeared" without polluting the PR.
            for (const d of dropped) {
              core.notice(
                `Dropped inline comment: ${d.reason}\n` +
                `  path=${d.c?.path} line=${d.c?.line} severity=${d.c?.severity}\n` +
                `  body=${(d.c?.body || "").slice(0, 200)}`
              );
            }

            // Hide prior bot inline review comments before posting fresh
            // ones. Otherwise multiple pushes leave stacked, possibly
            // contradictory comments on lines that didn't change. Done
            // before `createReview` so the new comments aren't picked up
            // by the cleanup pass.
            await hidePreviousInlineComments();

            // Post the GitHub review for the inline comments only. The
            // top-level summary is delivered as a separate PR comment so
            // we can hide previous summaries individually.
            //
            // body=" " (single space) — GitHub historically required either
            // a non-empty body or `comments`; empty-string body is accepted
            // today but inconsistently across endpoints. The space is a
            // belt-and-suspenders defense against a 422.
            if (comments.length > 0) {
              try {
                await github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number,
                  commit_id,
                  event: "COMMENT",
                  body: " ",
                  comments,
                });
              } catch (err) {
                if (err?.status === 422) {
                  // GitHub couldn't resolve at least one target line.
                  // Inline post failed; the summary still goes out.
                  // Logged to the action run, not the PR conversation.
                  core.warning(`createReview failed with 422; inline comments not posted.`);
                } else {
                  throw err;
                }
              }
            }

            // When the model produced no inline comments at all, surface
            // that to the reader so "summary only" reads as a deliberate
            // outcome instead of a missing section.
            const noInlineNote = comments.length === 0
              ? "\n\n_No inline comments._"
              : "";

            await postSummary(parsed.body + noInlineNote);

            // ----------------------------------------------------------------
            // Helpers
            // ----------------------------------------------------------------

            async function postSummary(summaryBody) {
              await hidePreviousSummaries();
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `${SUMMARY_MARKER}\n\n## PR summary\n\n${summaryBody}`,
              });
            }

            async function hidePreviousInlineComments() {
              // Inline review comments live on a different endpoint from
              // issue comments. Each new push posts fresh ones; without
              // cleanup, stale comments from prior runs accumulate on
              // unchanged lines (GitHub only auto-outdates when the line
              // itself is modified).
              const all = await github.paginate(github.rest.pulls.listReviewComments, {
                owner,
                repo,
                pull_number,
                per_page: 100,
              });
              const stale = all.filter(
                (c) => c.user && c.user.login === "github-actions[bot]"
              );
              await minimizeAll(stale, "inline");
            }

            async function hidePreviousSummaries() {
              const all = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pull_number,
                per_page: 100,
              });
              const stale = all.filter(
                (c) =>
                  c.user &&
                  c.user.login === "github-actions[bot]" &&
                  isString(c.body) &&
                  c.body.includes(SUMMARY_MARKER)
              );
              await minimizeAll(stale, "summary");
            }

            async function minimizeAll(comments, label) {
              for (const c of comments) {
                try {
                  await github.graphql(
                    `mutation($id: ID!) {
                       minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) {
                         minimizedComment { isMinimized }
                       }
                     }`,
                    { id: c.node_id }
                  );
                } catch (err) {
                  // Already-minimized comments throw; skip and continue.
                  core.warning(`Failed to minimize ${label} comment ${c.id}: ${err?.message || err}`);
                }
              }
            }
