name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  codex_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate PR context
        id: prctx
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --prune origin "$BASE"
          git diff --stat=120 --summary "$BASE...$HEAD" > /tmp/pr.stat
          git diff --name-only "$BASE...$HEAD" > /tmp/pr.files
          echo "file_count=$(wc -l </tmp/pr.files | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "stat_bytes=$(wc -c </tmp/pr.stat | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Build Codex prompt
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          printf '%s\n' \
            'Return JSON that matches the provided schema exactly.' \
            '' \
            "Review only the pull request changes between ${BASE} and ${HEAD}." \
            'Do not review untouched code except as needed for surrounding context.' \
            '' \
            'Write a concise PR review focused on:' \
            '- logical/correctness bugs (including UB/lifetime)' \
            '- code smells/design limitations' \
            '- long-term semantic concerns (invariants, API boundaries, coupling)' \
            '' \
            'Rules:' \
            '- body: 5-15 bullets max.' \
            '- comments: only actionable issues; prefer severity high/medium.' \
            '- For each inline comment: use the repo-relative file path, and a line number in the NEW file (RIGHT side).' \
            '- Do not output any extra text outside the JSON.' \
            '' \
            'Use local git commands instead of relying on an inlined full diff.' \
            "Recommended commands:" \
            "- git diff --stat=120 --summary ${BASE}...${HEAD}" \
            "- git diff --name-only ${BASE}...${HEAD}" \
            "- git diff --unified=80 ${BASE}...${HEAD} -- <path>" \
            "- git show ${HEAD}:<path>" \
            '' \
            "PR metadata:" \
            "- title: ${PR_TITLE}" \
            "- body: ${PR_BODY}" \
            "- changed files: ${{ steps.prctx.outputs.file_count }}" \
            "- diff summary bytes: ${{ steps.prctx.outputs.stat_bytes }}" \
            '' \
            'Changed files and diff summary:' \
            > /tmp/codex_prompt.txt
          cat /tmp/pr.files >> /tmp/codex_prompt.txt
          printf '%s\n' '' 'Diff stat:' >> /tmp/codex_prompt.txt
          cat /tmp/pr.stat >> /tmp/codex_prompt.txt

      - name: Run Codex using the generated prompt
        id: codex_run
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.2-codex
          # gpt-5.2-codex only accepts `text.verbosity = "medium"` on the
          # OpenAI Responses API. The action defaults to "low", which the
          # model rejects. Override via the Codex CLI's `-c` config flag
          # (maps to the API's text.verbosity param).
          codex-args: >-
            --output-schema .github/codex/schemas/pr_review.schema.json
            -c model_verbosity="medium"
          prompt-file: /tmp/codex_prompt.txt

      - name: Post GitHub Review (validate + fallback)
        uses: actions/github-script@v7
        with:
          script: |
            const raw = ${{ toJSON(steps.codex_run.outputs.final-message) }};

            function safeJsonParse(s) { try { return JSON.parse(s); } catch { return null; } }
            function isString(x) { return typeof x === "string"; }
            function isInt(x) { return Number.isInteger(x); }
            function parseRightDiffLines(patch) {
              const lines = new Set();
              if (!isString(patch)) return lines;

              let inHunk = false;
              let rightLine = 0;

              for (const row of patch.split("\n")) {
                const hunk = row.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (hunk) {
                  inHunk = true;
                  rightLine = Number(hunk[1]);
                  continue;
                }
                if (!inHunk) continue;

                if (row.startsWith("+") || row.startsWith(" ")) {
                  lines.add(rightLine);
                  rightLine++;
                  continue;
                }
                if (row.startsWith("-") || row.startsWith("\\")) continue;
              }
              return lines;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;
            const commit_id = context.payload.pull_request.head.sha;

            const parsed = safeJsonParse(raw);

            if (!parsed || !isString(parsed.body) || !Array.isArray(parsed.comments)) {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number,
                commit_id,
                event: "COMMENT",
                body: typeof raw === "string" ? raw : String(raw),
              });
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const validLinesByPath = new Map(
              files.map((f) => [f.filename, parseRightDiffLines(f.patch)])
            );

            const comments = [];
            let dropped = 0;

            for (const c of parsed.comments) {
              if (!c || !isString(c.path) || !isInt(c.line) || c.line < 1) { dropped++; continue; }
              if (c.side !== "RIGHT") { dropped++; continue; }
              if (!isString(c.body) || !isString(c.severity)) { dropped++; continue; }

              const severity = c.severity.toLowerCase();
              if (severity === "low") { dropped++; continue; }

              const validLines = validLinesByPath.get(c.path);
              if (!validLines || !validLines.has(c.line)) { dropped++; continue; }

              comments.push({ path: c.path, line: c.line, side: "RIGHT", body: `[${severity}] ${c.body}` });
              if (comments.length >= 20) break;
            }

            const body = dropped > 0
              ? `${parsed.body}\n\n(Filtered ${dropped} inline comment(s) that did not resolve to this PR diff.)`
              : parsed.body;

            const review = {
              owner,
              repo,
              pull_number,
              commit_id,
              event: "COMMENT",
              body,
              comments,
            };

            try {
              await github.rest.pulls.createReview(review);
            } catch (err) {
              if (err?.status === 422 && comments.length > 0) {
                await github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number,
                  commit_id,
                  event: "COMMENT",
                  body: `${body}\n\n(Inline comments omitted after GitHub could not resolve at least one target line.)`,
                  comments: [],
                });
                return;
              }
              throw err;
            }
